<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Hexagon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Neon Pulse Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-dasharray="24 12" stroke-opacity="0.6" />

  <!-- Center Barbell Shield Glyph -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="136" y="244" width="240" height="24" rx="12" fill="#ffffff" />
    
    <!-- Outer Plates Left -->
    <rect x="156" y="166" width="28" height="180" rx="10" fill="url(#primaryGrad)" />
    <rect x="122" y="196" width="22" height="120" rx="8" fill="url(#primaryGrad)" />
    <rect x="100" y="226" width="14" height="60" rx="5" fill="#94a3b8" />

    <!-- Outer Plates Right -->
    <rect x="328" y="166" width="28" height="180" rx="10" fill="url(#primaryGrad)" />
    <rect x="368" y="196" width="22" height="120" rx="8" fill="url(#primaryGrad)" />
    <rect x="398" y="226" width="14" height="60" rx="5" fill="#94a3b8" />

    <!-- Knurling Grips -->
    <line x1="220" y1="244" x2="220" y2="268" stroke="#0f172a" stroke-width="4" />
    <line x1="292" y1="244" x2="292" y2="268" stroke="#0f172a" stroke-width="4" />
    
    <!-- Center Lightning Bolt (Energy & PRs) -->
    <path d="M266 116 L232 240 L268 240 L242 396 L294 220 L256 220 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography Brand Accent -->
  <text x="256" y="446" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4">EDDIEB FIT</text>
</svg>
